<div class="section">
  <h3>登录</h3>
  <p class="subtitle">各角色统一登录入口，自适应布局</p>
</div>

<div class="mockup" style="max-width: 380px; margin: 0 auto; background: #fefbfb; border-radius: var(--radius-lg); overflow: hidden;">
  <!-- 顶部品牌区 -->
  <div style="background: #FF6600; padding: 2rem 1rem 1.5rem; text-align: center; color: white;">
    <div style="font-size: 2rem; margin-bottom: 0.3rem;">&#127968;</div>
    <div style="font-size: 1.1rem; font-weight: 700;">好雨粮库</div>
    <div style="font-size: 0.75rem; opacity: 0.85; margin-top: 0.2rem;">原粮进厂扦样系统</div>
  </div>

  <!-- 登录表单 -->
  <div class="mockup-body" style="padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1rem; background: #fefbfb;">

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label style="font-size: 0.8rem; color: #555; font-weight: 600;">用户名</label>
      <input class="mock-input" placeholder="请输入用户名" style="width: 100%; background: white; border: 1px solid #ddd; border-radius: 6px; padding: 0.7rem 0.75rem; font-size: 0.9rem; outline: none;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 0.25rem;">
      <label style="font-size: 0.8rem; color: #555; font-weight: 600;">密码</label>
      <input class="mock-input" type="password" placeholder="请输入密码" style="width: 100%; background: white; border: 1px solid #ddd; border-radius: 6px; padding: 0.7rem 0.75rem; font-size: 0.9rem; outline: none;">
    </div>

    <button style="width: 100%; padding: 0.75rem; background: #FF6600; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem;">
      登录
    </button>

    <div style="text-align: center; font-size: 0.75rem; color: #999; margin-top: 0.5rem;">
      登录即表示同意 <span style="color: #FF6600;">服务条款</span> 和 <span style="color: #FF6600;">隐私政策</span>
    </div>

  </div>
</div>

<div class="section" style="margin-top: 1.5rem;">
  <p class="subtitle" style="font-size: 0.85rem;">
    <strong>设计要点：</strong><br>
    &bull; 顶部品牌区 — 桔色背景上显示系统名称和说明<br>
    &bull; 简洁表单 — 仅用户名和密码两个字段<br>
    &bull; 底部服务条款链接<br>
    &bull; 自适应布局 — 手机端全宽，PC端居中卡片<br>
    &bull; 登录后根据角色跳转：司机→预约页，管理员→管理后台
  </p>
</div>
